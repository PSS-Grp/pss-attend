<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{title}}：{{record_id}}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}" media="all" />
    <style>
      /* [追加] 手配者が設定した「手当」（金額が入力された項目のみ）を、
           休憩欄の下に読み取り専用で表示するためのスタイル。 */
      .allowance-display {
        margin-top: 10px;
      }
      .allowance-display p {
        margin: 2px 0;
      }
    </style>

  </head>

  <body>

  <form action=/tsuya_modify method="post">

    <div id="frame">
      <p class="frame-title">通夜</p>
      <p class="name">お名前 ： {{ current_user.username }}</p>
    </div>

    <div id="frame">
      <p class="frame-title">勤務日／会館名</p>
      <p class="today">{{today}}　<span class="option">{{place2}}　{{other2}}</span></p>
    </div>

    <div id="frame">
      <p class="frame-title">勤務時間</p>
        <table width="100%">
          <tr>
            <td width="35%">  
              <p>出勤時間</p>
            </td>
            <td width="35%">  
              <p>退勤時間</p>
            </td>
          </tr>
          <tr>
            <td width="35%">  
              <p>{{start2}}</p>
            </td>
            <td width="35%">  
              <p>
              <input type="time" required id="end2" name="end2" value="{{end2}}" />
              </p>
            </td>
          </tr>
        </table>
    </div>
    <div id="frame">
      <p class="frame-title">手当</p>
      <p class="option">
        <!-- [追加] 「手当」欄の先頭に「休憩」を追加。チェックを入れると
             休憩時間（分）の入力欄が使えるようになる。 -->
        &emsp;<input type="checkbox" id="break2" name="break2" onchange="toggleBreak2()" {{break2}}/>&emsp;
        <label for="break2">休憩</label>
        <input type="number" min="0" step="1" disabled id="break_minutes2" name="break_minutes2" placeholder="分" value="{{break_minutes2}}"/>

        <!-- [修正] リーダー・サブリーダー・研修・待機・指定日・遠方地・
             特別手当・高速道路は、手配者が手配書登録画面
             (/arrangement_manage)で金額まで指定して設定する方式に変更した
             ため、この画面ではチェックボックスとしては扱わず、金額が
             入力された項目だけを休憩の下に読み取り専用で表示する。 -->
        {% if allowance_items %}
        <div class="allowance-display">
          {% for item in allowance_items %}
          <p>{{ item.label }}：{{ "{:,}".format(item.amount) }}円</p>
          {% endfor %}
        </div>
        {% endif %}
      </p>
    </div>

      <!-- [追加] 「休憩」チェックボックスの状態に応じて、休憩時間（分）の
           入力欄の有効／無効を切り替える。 -->
      <script>
        var break_minutes2_elem = document.getElementById("break_minutes2");
        function toggleBreak2() {
          if (document.getElementById("break2").checked) {
                break_minutes2_elem.disabled = false;
          } else {
                break_minutes2_elem.disabled = true;
          }
        }
      </script>

      <p class="submit">
        <input type="submit" value="登録" />
      </p>

  </form>
  </body>

</html>
