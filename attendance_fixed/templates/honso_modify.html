<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>{{title}}：{{record_id}}</title>
    <link rel="stylesheet" type="text/css" href="{{ url_for('static', filename='css/style.css') }}" media="all" />

  </head>

  <body>

  <form action=/honso_modify method="post">

    <div id="frame">
      <p class="frame-title">本葬</p>
      <p class="name">お名前 ： {{ current_user.username }}</p>
    </div>

    <div id="frame">
      <p class="frame-title">勤務日／会館名</p>
      <p class="today">{{today}}　<span class="option">{{place1}}　{{other1}}</span></p>
    </div>

    <div id="frame">
      <p class="frame-title">勤務時間</p>
        <table width="100%">
          <tr>
            <td width="35%">  
              <p>出勤時間</p>
            </td>
            <td width="35%">  
              <p>退勤時間</p>
            </td>
          </tr>
          <tr>
            <td width="35%">  
              <p>{{start1}}</p>
            </td>
            <td width="35%">  
              <p>
              <input type="time" required id="end1" name="end1" value="{{end1}}" />
              </p>
            </td>
          </tr>
        </table>
    </div>
    <div id="frame">
      <p class="frame-title">手当</p>
      <p class="option">
        &emsp;<input type="checkbox" id="leader1" name="leader1" {{leader1}}/>&emsp;
        <label for="leader">リーダー</label><br />

        &emsp;<input type="checkbox" id="subleader1" name="subleader1" {{subleader1}}/>&emsp;
        <label for="subleader">サブリーダー</label><br />

        &emsp;<input type="checkbox" id="teach1" name="teach1" {{teach1}}/>&emsp;
        <label for="teach">研修</label><br />

        &emsp;<input type="checkbox" id="wait1" name="wait1" {{wait1}}/>&emsp;
        <label for="wait">待機</label><br />

        &emsp;<input type="checkbox" id="designated1" name="designated1" {{designated1}}/>&emsp;
        <label for="designated">指定日</label><br />

        &emsp;<input type="checkbox" id="distant1" name="distant1" {{distant1}}/>&emsp;
        <label for="distant">遠方地</label><br />

        &emsp;<input type="checkbox" id="special1" name="special1" {{special1}}/>&emsp;
        <label for="special1">特別手当</label><br />

        &emsp;<input type="checkbox" id="highway1" name="highway1" onchange="change()" {{highway1}}/>&emsp;
        <label for="distant">高速道路</label>
        <input type="number" required disabled id="express1" name="express1" placeholder="金額" value="{{express1}}"/><br />
      </p>
    </div>

      <script>
        var express1_elem = document.getElementById("express1");
        function change() {
          if (document.getElementById("highway1").checked) {
    		express1_elem.disabled = false;   //trueグレーアウト
          } else {
                express1_elem.disabled = true;
          }
        }
      </script>

      <p class="submit">
        <input type="submit" value="登録" />
      </p>

  </form>
  </body>

</html>
