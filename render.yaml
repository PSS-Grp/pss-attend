#------------------------------------------------
# Render.com 用のBlueprint定義。
#
# Renderのダッシュボードで「New +」→「Blueprint」からこのリポジトリを
# 選択すると、このファイルの内容にもとづいてWebサービスが自動的に
# 作成される（手動でビルド/起動コマンドなどを設定する必要はない）。
#
# [修正/Neon対応] 勤怠記録(Time)・手配書(Arrangement)のデータ、および
# 手配書のアップロード画像・PDF（DB内にバイナリとして保存する方式に
# 変更済み。arrangement.py・models.py参照）は、すべて環境変数
# DATABASE_URL で指定するNeon（マネージドのPostgreSQL）に保存する。
# これにより、以前使っていたRenderの永続ディスク(Persistent Disk)や、
# それが必要とする有料プランが不要になったため、planはfreeプランを
# 指定している（ダッシュボードからいつでも上位プランに変更可能）。
# DATABASE_URLの値はこのファイルにはコミットせず、Renderのダッシュボード
# （Environment）側で直接設定すること（sync: falseにより、Blueprint
# 適用時にRenderから入力を求められる）。
#------------------------------------------------

services:
  - type: web
    runtime: python
    name: pss-attend
    plan: free
    buildCommand: "pip install -r attendance_fixed/requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT"
    healthCheckPath: /login
    envVars:
      # [追加] セッション暗号化用のシークレットキー。generateValue:trueに
      # より、初回デプロイ時にRenderが安全なランダム値を1度だけ生成し、
      # 以降の再デプロイ・再起動でも同じ値が使われ続ける
      # （＝ログインセッションが再デプロイのたびに切れることはない）。
      - key: ATTENDANCE_SECRET_KEY
        generateValue: true
      # [追加/Neon対応] NeonダッシュボードでコピーできるConnection string
      # （postgresql://ユーザー名:パスワード@ホスト/データベース名?sslmode=require
      # の形式）をそのまま設定する。sync: falseのため値はgitリポジトリには
      # 保存されず、Renderのダッシュボード（Environment）側で入力・管理する。
      - key: DATABASE_URL
        sync: false
      # Renderが自動的に PYTHON_VERSION より優先して .python-version を
      # 参照するため、ここでの指定は不要（リポジトリ直下の .python-version
      # ファイルを参照）。
