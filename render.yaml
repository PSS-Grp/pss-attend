#------------------------------------------------
# Render.com 用のBlueprint定義。
#
# Renderのダッシュボードで「New +」→「Blueprint」からこのリポジトリを
# 選択すると、このファイルの内容にもとづいてWebサービスが自動的に
# 作成される（手動でビルド/起動コマンドなどを設定する必要はない）。
#
# ・勤怠記録(Time)・手配書(Arrangement)のデータと、手配書のアップロード
#   画像は、SQLiteファイル＋Renderの永続ディスク(Persistent Disk)に
#   保存する。永続ディスクは有料プラン(freeプラン以外)でのみ利用できる
#   ため、planは有料の最小構成(0.5c-512mb)を指定している
#   （ダッシュボードからいつでも上位プランに変更可能）。
# ・永続ディスクは1サービスにつき1つ・1インスタンスのみからアクセス
#   可能という制約があるため、このサービスは複数インスタンスへの
#   自動スケールはできない（このアプリの利用規模であれば通常問題ない）。
#------------------------------------------------

services:
  - type: web
    runtime: python
    name: pss-attend
    plan: 0.5c-512mb
    buildCommand: "pip install -r attendance_fixed/requirements.txt"
    startCommand: "gunicorn wsgi:app --workers 2 --timeout 60 --bind 0.0.0.0:$PORT"
    healthCheckPath: /login
    disk:
      name: pss-attend-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      # [追加] セッション暗号化用のシークレットキー。generateValue:trueに
      # より、初回デプロイ時にRenderが安全なランダム値を1度だけ生成し、
      # 以降の再デプロイ・再起動でも同じ値が使われ続ける
      # （＝ログインセッションが再デプロイのたびに切れることはない）。
      - key: ATTENDANCE_SECRET_KEY
        generateValue: true
      # [追加] DBファイル・アップロード画像の保存先を、上記の永続ディスクの
      # マウント先に向ける（__init__.py参照）。
      - key: ATTENDANCE_DATA_DIR
        value: /var/data
      # Renderが自動的に PYTHON_VERSION より優先して .python-version を
      # 参照するため、ここでの指定は不要（リポジトリ直下の .python-version
      # ファイルを参照）。
